{% extends "contests/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div style="max-width:560px;margin:0 auto">
  <div class="page-head">
    <div>
      <div class="eyebrow">Entry Form</div>
      <h1 class="page">{{ title }}</h1>
    </div>
  </div>
  <div class="card">
    <form method="post" enctype="multipart/form-data" class="fields">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem">
        <button class="btn">保存する</button>
        <a class="btn ghost" href="{% if back %}{{ back.get_absolute_url }}{% else %}javascript:history.back(){% endif %}">キャンセル</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
