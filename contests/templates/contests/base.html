<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}taikai{% endblock %} | taikai 流行語大会</title>
  <style>
    :root { --bg:#faf7f2; --card:#fff; --ink:#222; --muted:#777; --line:#e6e0d6; --accent:#c0392b;
            --gold:#c9a227; --silver:#8e9aa6; --bronze:#b5651d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height:1.6; }
    header { background:var(--ink); color:#fff; padding:.75rem 1rem; }
    header .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:1rem; }
    header a { color:#fff; text-decoration:none; }
    header .brand { font-weight:700; font-size:1.2rem; margin-right:auto; }
    .wrap { max-width:860px; margin:0 auto; padding:0 1rem; }
    main { padding-block:1.5rem; }
    a { color:var(--accent); }
    h1 { font-size:1.5rem; margin:.2rem 0 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem 1.2rem; margin-bottom:1rem; }
    .muted { color:var(--muted); font-size:.9rem; }
    .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .spacer { margin-left:auto; }
    .btn { display:inline-block; padding:.45rem .9rem; border-radius:6px; border:1px solid var(--accent);
           background:var(--accent); color:#fff; text-decoration:none; cursor:pointer; font-size:.95rem; }
    .btn.ghost { background:transparent; color:var(--accent); }
    .btn.danger { background:#fff; color:#a00; border-color:#a00; }
    form.inline { display:inline; }
    .badge { display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.8rem; font-weight:700;
             background:#555; color:#fff; }
    .badge.o1 { background:var(--gold); } .badge.o2 { background:var(--silver); } .badge.o3 { background:var(--bronze); }
    .word { font-size:1.4rem; font-weight:700; margin:.3rem 0; }
    .entry img { max-width:100%; max-height:320px; border-radius:8px; margin-top:.5rem; }
    .song { border-left:4px solid var(--gold); }
    .messages { list-style:none; padding:0; }
    .messages li { background:#e8f5e9; border:1px solid #b7dfb9; padding:.5rem .8rem; border-radius:6px; }
    .messages li.error { background:#fdecea; border-color:#f5c2c0; }
    form p { margin:.8rem 0; }
    form label { display:block; font-weight:600; margin-bottom:.2rem; }
    input[type=text], input[type=url], input[type=date], input[type=search], select, textarea {
      width:100%; padding:.5rem; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
    .helptext { color:var(--muted); font-size:.85rem; }
    .errorlist { color:#a00; padding-left:1rem; margin:.2rem 0; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--line); }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="{% url 'contests:contest_list' %}">🏆 taikai 流行語大会</a>
    <a href="{% url 'contests:contest_list' %}">大会一覧</a>
    <a href="{% url 'contests:song_list' %}">テーマソング</a>
    <a href="{% url 'contests:ranking' %}">ランキング</a>
    <a href="{% url 'contests:award_list' %}">賞の設定</a>
  </div>
</header>
<main class="wrap">
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
