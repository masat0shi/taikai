<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a08">
  <title>TAIKAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b0a08; --surface:#15130f; --surface-2:#1c1914; --line:#2e281d; --line-2:#463c2a;
      --ink:#f4eee1; --muted:#9b917f; --dim:#6d6556;
      --gold:#d8b45a; --gold-hi:#f7e3a1; --gold-lo:#9c7424;
      --silver:#cfd3d8; --bronze:#d29a68; --danger:#e07a6a;
      --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
      --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
      --latin:"Cormorant Garamond","Times New Roman",serif;
      --radius:14px;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:var(--sans); line-height:1.7;
           background:
             radial-gradient(1200px 500px at 50% -200px, rgba(216,180,90,.13), transparent 70%),
             var(--bg);
           -webkit-font-smoothing:antialiased; }
    a { color:var(--gold); text-decoration:none; }
    a:hover { color:var(--gold-hi); }
    .wrap { max-width:920px; margin:0 auto; padding-inline:clamp(16px,4vw,32px); }

    /* ヘッダー */
    header.site { position:sticky; top:0; z-index:10; backdrop-filter:blur(10px);
                  background:rgba(11,10,8,.82); border-bottom:1px solid var(--line); }
    header.site .wrap { display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; padding-block:.85rem; }
    .brand { display:flex; align-items:baseline; gap:.6rem; margin-right:auto; color:var(--ink); }
    .brand .mark { font-family:var(--latin); font-weight:600; font-size:1.45rem; letter-spacing:.32em;
                   background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
                   -webkit-background-clip:text; background-clip:text; color:transparent; }
    nav.main { display:flex; gap:1.3rem; flex-wrap:wrap; font-size:.88rem; }
    nav.main a { color:var(--muted); letter-spacing:.08em; padding-block:.2rem; border-bottom:1px solid transparent; }
    nav.main a:hover, nav.main a.on { color:var(--ink); border-bottom-color:var(--gold); }

    main { padding-block:clamp(1.8rem,5vw,3.2rem) 5rem; }

    /* 見出し */
    .eyebrow { font-family:var(--latin); font-size:.95rem; letter-spacing:.35em; color:var(--gold); text-transform:uppercase; }
    h1.page { font-family:var(--mincho); font-weight:800; font-size:clamp(1.7rem,4.5vw,2.4rem);
              letter-spacing:.06em; margin:.2rem 0 0; line-height:1.3; }
    .page-head { display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:2rem; }
    .page-head .actions { margin-left:auto; display:flex; gap:.6rem; flex-wrap:wrap; }
    .lead { color:var(--muted); font-size:.92rem; margin:-1rem 0 2rem; }

    /* ボタン */
    .btn { display:inline-flex; align-items:center; gap:.4rem; font:inherit; font-size:.88rem; font-weight:700;
           letter-spacing:.08em; padding:.62rem 1.15rem; border-radius:999px; cursor:pointer;
           color:#1a1306; border:1px solid var(--gold);
           background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b98f35); transition:filter .15s, transform .15s; }
    .btn:hover { color:#1a1306; filter:brightness(1.08); transform:translateY(-1px); }
    .btn.ghost { background:transparent; color:var(--gold); border-color:var(--line-2); }
    .btn.ghost:hover { border-color:var(--gold); color:var(--gold-hi); }
    .textlink { background:none; border:0; padding:0; font:inherit; font-size:.8rem; color:var(--dim); cursor:pointer; letter-spacing:.06em; }
    .textlink:hover { color:var(--ink); }
    .textlink.danger:hover { color:var(--danger); }
    .tools { display:flex; gap:1rem; align-items:center; }
    form.inline { display:inline; margin:0; }

    /* 賞バッジ */
    .award { display:inline-flex; align-items:center; gap:.45rem; font-family:var(--mincho); font-weight:700;
             font-size:.82rem; letter-spacing:.18em; color:var(--muted); }
    .award::before { content:""; width:.5rem; height:.5rem; transform:rotate(45deg); background:currentColor; }
    .award.t1 { color:var(--gold); } .award.t2 { color:var(--silver); } .award.t3 { color:var(--bronze); }

    /* 言葉 */
    .word { font-family:var(--mincho); font-weight:800; letter-spacing:.06em; line-height:1.35; margin:0;
            overflow-wrap:anywhere; }
    .word .q { color:var(--gold-lo); font-weight:500; }
    .gold-text { background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);
                 -webkit-background-clip:text; background-clip:text; color:transparent; }
    .speaker { color:var(--muted); font-size:.9rem; letter-spacing:.06em; }
    .speaker::before { content:"— "; color:var(--dim); }

    /* カード */
    .card { background:linear-gradient(180deg,var(--surface-2),var(--surface)); border:1px solid var(--line);
            border-radius:var(--radius); padding:clamp(1.1rem,3vw,1.6rem); }
    .stack > * + * { margin-top:1.1rem; }

    /* テーマソング */
    .song { display:flex; align-items:center; gap:.9rem; padding:.85rem 1.1rem; border:1px solid var(--line);
            border-radius:999px; background:rgba(216,180,90,.05); font-size:.9rem; }
    .song .note { flex:none; width:2rem; height:2rem; display:grid; place-items:center; border-radius:50%;
                  background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo)); color:#1a1306; font-size:.95rem; }
    .song .label { color:var(--muted); font-size:.75rem; letter-spacing:.2em; display:block; line-height:1.3; }
    .song strong { font-family:var(--mincho); font-weight:700; color:var(--ink); }
    .song a strong { color:var(--gold-hi); }

    /* メッセージ */
    .messages { list-style:none; padding:0; margin:0 0 1.5rem; }
    .messages li { padding:.7rem 1rem; border-radius:10px; font-size:.9rem;
                   border:1px solid rgba(216,180,90,.35); background:rgba(216,180,90,.08); color:var(--gold-hi); }
    .messages li.error { border-color:rgba(224,122,106,.4); background:rgba(224,122,106,.08); color:#f2b1a6; }

    /* フォーム */
    form.fields p { margin:0 0 1.3rem; }
    form.fields label { display:block; font-size:.8rem; font-weight:700; letter-spacing:.14em; color:var(--muted); margin-bottom:.4rem; }
    input[type=text], input[type=url], input[type=date], input[type=search], input[type=number], select, textarea {
      width:100%; padding:.75rem .9rem; font:inherit; color:var(--ink); background:var(--bg);
      border:1px solid var(--line-2); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s; color-scheme:dark; }
    input:focus, select:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(216,180,90,.18); }
    input[type=file] { color:var(--muted); font-size:.85rem; }
    input[type=file]::file-selector-button { font:inherit; font-weight:700; margin-right:.8rem; padding:.45rem .9rem;
      border-radius:999px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); cursor:pointer; }
    input[type=checkbox] { accent-color:var(--gold); width:1.1rem; height:1.1rem; vertical-align:middle; }
    .helptext { display:block; color:var(--dim); font-size:.78rem; margin-top:.35rem; }
    .errorlist { list-style:none; padding:0; margin:0 0 .4rem; color:var(--danger); font-size:.85rem; }

    .empty { text-align:center; padding:3.5rem 1rem; color:var(--muted); border:1px dashed var(--line-2); border-radius:var(--radius); }
    .empty .word { font-size:1.4rem; color:var(--dim); margin-bottom:.6rem; }

    table { width:100%; border-collapse:collapse; font-size:.92rem; }
    th { text-align:left; font-size:.72rem; letter-spacing:.2em; color:var(--dim); font-weight:700; padding:.6rem .5rem; border-bottom:1px solid var(--line-2); }
    td { padding:.85rem .5rem; border-bottom:1px solid var(--line); vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    .table-wrap { overflow-x:auto; }

    footer.site { border-top:1px solid var(--line); color:var(--dim); font-size:.75rem; letter-spacing:.3em; text-align:center; padding:2rem 0 3rem; font-family:var(--latin); }
    /* ジャック・殿堂入りタグ */
    .tag { display:inline-flex; align-items:center; gap:.3rem; font-family:var(--latin); font-weight:600; font-size:.72rem;
           letter-spacing:.2em; padding:.12rem .65rem; border-radius:999px; vertical-align:middle; white-space:nowrap; }
    .tag.jack { color:var(--gold-hi); border:1px solid var(--gold); background:rgba(216,180,90,.1); }
    .tag.hof { color:#1a1306; background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b98f35); }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{% url 'contests:contest_list' %}"><span class="mark">TAIKAI</span></a>
    {% with u=request.resolver_match.url_name %}
    <nav class="main">
      <a href="{% url 'contests:contest_list' %}" class="{% if u == 'contest_list' or 'contest_' in u or 'entry_' in u %}on{% endif %}">大会</a>
      <a href="{% url 'contests:song_list' %}" class="{% if 'song_' in u %}on{% endif %}">テーマソング</a>
      <a href="{% url 'contests:ranking' %}" class="{% if u == 'ranking' %}on{% endif %}">ランキング</a>
      <a href="{% url 'contests:hall_of_fame' %}" class="{% if u == 'hall_of_fame' %}on{% endif %}">殿堂</a>
      <a href="{% url 'contests:award_list' %}" class="{% if 'award_' in u %}on{% endif %}">賞の設定</a>
    </nav>
    {% endwith %}
  </div>
</header>
<main class="wrap">
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="site">TAIKAI</footer>
</body>
</html>
